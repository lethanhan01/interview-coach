sonar.projectKey=lethanhan01_interview-coach
sonar.organization=lethanhan01

# Source code scoping
sonar.sources=server/src,client,ai-service
sonar.exclusions=server/prisma/migrations/**,server/scripts/**,data/scripts/**,ai-service/data/scripts/**,client/.next/**,server/dist/**,**/coverage/**,**/*.stories.tsx

# Test scoping
sonar.tests=server/src,client,ai-service,server/test
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/*.test.py,server/test/**,client/vitest.setup.ts

# Coverage reporting paths
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,client/coverage/lcov.info
sonar.sourceEncoding=UTF-8
