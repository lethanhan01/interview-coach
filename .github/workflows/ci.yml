name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build
        env:
          NEXT_PUBLIC_AUTH_ENABLED: 'true'
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_e9vpeD0u6DlCkbD2C_aycw_FUlVyuoj
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1

  server:
    name: Server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: interviewcoach_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d interviewcoach_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: npm run db:validate

      # Generate Prisma client from schema — required for TypeScript compilation
      - run: npx prisma generate

      # Keep production code linted while legacy test mocks are cleaned up.
      - name: Lint production sources
        run: npx eslint "src/**/*.ts" --ignore-pattern "**/*.spec.ts"

      - run: npm run build

      - name: Prepare isolated test database
        run: npx prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/interviewcoach_test?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5433/interviewcoach_test?schema=public

      - name: Unit tests
        run: npm test -- --runInBand --passWithNoTests
        env:
          NODE_ENV: test
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder_anon_key
          SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role_key
          SUPABASE_JWT_SECRET: placeholder_jwt_secret_minimum_32_characters_long
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          OPENAI_API_KEY: sk-placeholder
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          PORT: '3000'
          CLIENT_URL: http://localhost:5173

      - name: Integration tests
        run: npm run test:integration

      - name: HTTP contract tests
        run: npm run test:e2e

  server-container:
    name: Server Docker image
    runs-on: ubuntu-latest
    needs: server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare server image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/interviewcoach-server" >> "$GITHUB_OUTPUT"

      - name: Extract server image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=ref,event=pr

      - name: Build server Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          target: runner
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
          network: host

      - name: Inspect server Docker image
        run: docker image inspect ${{ steps.image.outputs.name }}:sha-${{ github.sha }}

      - name: Smoke test server Docker image artifacts
        run: >
          docker run --rm
          --entrypoint node
          ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          -e "const fs = require('node:fs'); fs.accessSync('/app/dist/main.js'); fs.accessSync('/app/node_modules/.prisma/client/index.js'); if (process.env.NODE_ENV !== 'production') process.exit(1); if (process.getuid && process.getuid() === 0) process.exit(1); console.log('Server image artifact smoke OK');"
