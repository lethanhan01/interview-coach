name: Deploy Server to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: 'Nhánh Git muốn build & deploy lên VPS'
        required: true
        default: 'main'
      run_migration:
        description: 'Chạy Prisma migration khi deploy (true/false)'
        required: false
        default: 'true'

permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: CHẠY KIỂM THỬ TRÊN GITHUB CLOUD RUNNER (ubuntu-latest)
  # ----------------------------------------------------------------------------
  test-and-verify:
    name: Server (Lint & Test Quality Gate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: interviewcoach_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d interviewcoach_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.deploy_branch || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint source code
        run: npx eslint "src/**/*.ts" --ignore-pattern "**/*.spec.ts"

      - name: Compile TypeScript
        run: npm run build

      - name: Prepare test database
        run: npx prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/interviewcoach_test?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5433/interviewcoach_test?schema=public

      - name: Run Unit Tests
        run: npm test -- --runInBand --passWithNoTests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/interviewcoach_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: '6379'

      - name: Run Integration Tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/interviewcoach_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: '6379'

  # ----------------------------------------------------------------------------
  # JOB 2: BUILD & PUSH DOCKER IMAGE LÊN GHCR (ubuntu-latest)
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Server (Docker Build & Push)
    needs: [test-and-verify]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.deploy_branch || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/interviewcoach-server
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  # ----------------------------------------------------------------------------
  # JOB 3: TRIỂN KHAI TRÊN VPS QUA SELF-HOSTED RUNNER (runs-on: self-hosted)
  # ----------------------------------------------------------------------------
  deploy-to-vps:
    name: Server (Deploy on VPS via Self-hosted Runner)
    needs: [build-and-push]
    runs-on: [self-hosted]
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.deploy_branch || github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute deployment script on VPS
        shell: bash
        env:
          CONFIGURED_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          SERVER_IMAGE: ghcr.io/${{ github.repository }}/interviewcoach-server:latest
        run: |
          set -euo pipefail

          # 1. Tự động xác định thư mục deploy có file .env trên VPS
          DEPLOY_DIR="${CONFIGURED_DEPLOY_PATH:-}"
          if [[ -z "$DEPLOY_DIR" ]]; then
            if [[ -f "$HOME/interview-coach/server/.env" ]]; then
              DEPLOY_DIR="$HOME/interview-coach/server"
            elif [[ -f "$HOME/InterviewCoach/server/.env" ]]; then
              DEPLOY_DIR="$HOME/InterviewCoach/server"
            elif [[ -f "/opt/interview-coach/server/.env" ]]; then
              DEPLOY_DIR="/opt/interview-coach/server"
            elif [[ -f "$GITHUB_WORKSPACE/server/.env" ]]; then
              DEPLOY_DIR="$GITHUB_WORKSPACE/server"
            else
              echo "❌ Lỗi: Không tìm thấy thư mục deploy có file .env!"
              echo "💡 Vui lòng tạo Repository Variable 'VPS_DEPLOY_PATH' trong GitHub Settings (ví dụ: /home/ubuntu/InterviewCoach/server)."
              exit 1
            fi
          fi

          echo "📁 Thư mục deploy mục tiêu trên VPS: $DEPLOY_DIR"
          cd "$DEPLOY_DIR"

          # 2. Đồng bộ các file cấu hình mới nhất từ repository vào thư mục deploy
          echo "🔄 Đồng bộ docker-compose.yml, prisma schema và deploy.sh..."
          cp "$GITHUB_WORKSPACE/server/docker-compose.yml" ./docker-compose.yml
          cp "$GITHUB_WORKSPACE/server/deploy.sh" ./deploy.sh
          chmod +x ./deploy.sh
          mkdir -p ./prisma
          cp -r "$GITHUB_WORKSPACE/server/prisma/"* ./prisma/
          if [[ -f "$GITHUB_WORKSPACE/server/prisma.config.ts" ]]; then
            cp "$GITHUB_WORKSPACE/server/prisma.config.ts" ./prisma.config.ts
          fi

          # 3. Kích hoạt quy trình deploy an toàn
          export SERVER_IMAGE="$SERVER_IMAGE"
          export DEPLOY_MODE=pull
          export RUN_PRISMA_MIGRATE="${{ github.event.inputs.run_migration || 'true' }}"

          bash ./deploy.sh
